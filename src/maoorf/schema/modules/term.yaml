id: https://w3id.org/eu-parc/maoorf/modules/term
name: maoorf_term
title: Toxicology Experiment Reporting Module (TERM)
description: >-
  Toxicology Experiment Reporting Module (TERM) of the OECD Omics Reporting Framework (OORF)
license: MIT

prefixes:
  maoorf: https://w3id.org/eu-parc/maoorf/
  linkml: https://w3id.org/linkml/
  oecd_oorf_2023: https://w3id.org/eu-parc/oecd/oorf/2023/

default_prefix: maoorf
default_range: string

imports:
  - linkml:types
  - ../core/types
  - ../core/entities

classes:
  TERM:
    description: |-
      Toxicology Experiment Reporting Module (TERM)

      The TERM serves to capture and report the key descriptors of the in vivo or in vitro toxicology study from which samples are derived for omics analyses. One TERM should be reported per study, irrespective of whether one or more omics approaches are applied or whether one or more types of data analysis are performed.
    exact_mappings:
      - oecd_oorf_2023:2
    attributes:
      study_rationale:
        description: |-
          Study Rationale

          A clear and concise report of the study rationale is necessary to understand the suitability of the experimental design for the regulatory question being addressed, including the selection of experimental model, sex, target tissue, dosing regimen, etc. These fundamental aspects of the experimental design are clearly dependent on the study rationale.
        range: TERMStudyRationale
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.1
      test_and_control_items:
        description: |-
          Test and Control items

          Regulatory scientists must have all test items, vehicle, and control identification and characterisation information to accurately interpret omic study results. The following information should be reported for all test items: A) test substance, B) vehicle, and C) controls, including: test item name, mixture formulation composition, preparation of test item, physicochemical properties, chemical stability, commercial source and substance-specific identifiers.
        range: TERMTestAndControlItems
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.2
      test_system_characteristics:
        description: |-
          Test System Characteristics

          Similar to traditional toxicity testing, it is critical that regulatory scientists applying omics data for risk assessment be provided with comprehensive information regarding the characteristics of the test system from which the data are derived. Test system refers to the biological system that is exposed to the test items to obtain experimental data.
        range: TERMTestSystemCharacteristics
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.3
      study_design:
        description: |-
          Study Design

          Study designs are based on the assessment of all available information for factors that have the potential to influence study results. A detailed description of all elements and parameters included in the study design will increase transparency and confidence in the data, and as a result, will have greater utility in regulatory assessment.
        range: TERMStudyDesign
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.4
      treatment_conditions:
        description: |-
          Treatment Conditions

          The objective of the omic study informs the selection of the treatment conditions, which, in turn, impact the final outcome. Omic analyses may produce different results depending on the route of administration, the dose levels and the time and schedule of the exposure. Thus, a thorough description of treatment conditions is necessary for interpreting omic study results.
        range: TERMTreatmentConditions
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.5
      study_exit_and_sample_collection:
        description: |-
          Study Exit and Sample Collection

          Omics can be conducted using samples from animal or in vitro studies to produce a "snapshot" of transcript, protein or metabolite levels and enable analysis of perturbations in biological pathways and processes. Proper sample preparation is a key step in omics studies and adequate care must be taken to ensure sample fidelity.
        range: TERMStudyExitAndSampleCollection
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.6
      sample_identification_codes:
        description: |-
          Sample Identification Codes

          Sample management is a critical component of regulatory and non-regulatory experimentation which should be carefully planned. A standard operating procedure (SOP) should be established to ensure identification, tracking, unbiased testing and data collection records for each sample.
        range: TERMSampleIdentificationCodes
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.7
      supporting_data_streams:
        description: |-
          Supporting Data Streams

          To benefit optimally from the data generated, additional information should be reported to the extent possible. This information can range from OECD Test Guidelines for a particular animal study to methodological Standard Operating Procedures (SOP) to scientific publications in which analysis of (a subset of) the data has been described. Toxicity or cytotoxicity experiments necessary to establish the appropriate doses/concentrations can also be reported here.
        range: TERMSupportingDataStreams
        exact_mappings:
          - oecd_oorf_2023:2.8

  TERMStudyRationale:
    description: |-
      Study Rationale

      Overall, a clear rationale describing why an omics study was undertaken is required to assess the suitability of the experimental design and its intended use for regulatory decision making. This section is intended to be a narrative description of the reasoning for the study and its design. Details of the study parameters are to be provided in later sections.
    exact_mappings:
      - oecd_oorf_2023:2.1
    attributes:
      background_information:
        description: |-
          Background information

          Provide necessary background information for the end-user to understand the rationale for why the study was undertaken, including the regulatory question(s).
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.1.1
      objectives:
        description: |-
          Objectives

          Clearly define the objectives of the study toward informing the regulatory question. Describe whether the study results are intended to be interpreted in isolation or in combination with results from other studies.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.1.2
      test_guideline_compliance:
        description: |-
          Test guideline compliance

          If appropriate, please refer to which OECD Test Guidelines have been followed in the performance of the method.
        comments:
          - If appropriate, please refer to which OECD Test Guidelines have been followed in the performance of the method.
        exact_mappings:
          - oecd_oorf_2023:2.1.3
      mechanistic_understanding:
        description: |-
          Mechanistic understanding

          Briefly describe any prior toxicological, mode of action, or mechanistic information that is useful to understanding the study rationale (e.g. established mechanism of action and its relationship to the toxicological effect of interest).
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.1.4
      model_selection:
        description: |-
          Model selection

          Rationale for the selection of animal species, strain, model, tissue, or in vitro test system.
        range: TERMModelSelection
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.1.5
      dose_concentration_level_and_interval_selection:
        description: |-
          Dose / concentration level and interval selection

          Provide a brief rationale for the selection of the employed dose (in vivo) or test concentration (in vitro) levels and intervals. For example, selection for in vivo experimentation may be based on known toxicological effects or molecular changes documented for the test item identified in prior studies, allowing for "read-across" between omics data generated and other in-life findings, or clinical pathological changes and pathological observations. Note that dose interval information should include the time of exposure during the day. Similarly, in the case of in vitro experiments, if a relationship is sought to in vivo exposures, test item concentrations may be chosen using a quantitative in vitro/in vivo extrapolation (IVIVE) rationale; a rationale for the top concentration selected should be included.
        comments:
          - Report dose levels & rationale for dose level selection
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.1.6
      route_of_administration:
        description: |-
          Route of administration

          Where relevant, provide a rationale for the choice of route of administration, referring to objectives of the study, potential route of human exposure, the physical and chemical characteristics of the test item and the relevance for the evaluated endpoint.
        comments:
          - Report route of administration and rationale for selecting this route.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.1.7
      time_point_selection:
        description: |-
          Time point selection

          Provide a brief rationale for the exposure durations and sampling time points. Transcriptome, proteome, and metabolome profiles are dependent on both the duration of exposure and the time of sample collection. Responses reflect cellular adaptation over time, with early time points reflecting molecular initiating and early key events, and later time points reflecting pathological changes or adaptation. For in vivo studies, the interval between the final dosing and sample procurement should be specified. The same is true for sampling-time post-treatment for in vitro studies.
        comments:
          - Report time points & rational for time point selection
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.1.8
      samples_and_replicates:
        description: |-
          Samples and Replicates

          Provide a clear rationale for the choice of biological, technical, and analytical replicate numbers.
        range: TERMSamplesAndReplicatesRationale
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.1.9
      limitations:
        description: |-
          Limitations

          To facilitate regulatory evaluation, when appropriate, indicate the study limitations that could affect the outcome or interpretation of the results. These can include technical or mechanistic limitations in relation to known modes of action. For example, if the experiment includes poorly described test systems that would be a source of uncontrollable variability (e.g. a limitation of cell systems may be a lack of information about metabolic capacity), such information should be available to the evaluator. Likewise, some of the test items used might have physicochemical properties (lipophilicity, volatility, etc.) that might lead to a cell exposure that is different from the expected exposure (through interaction with plastic or proteins in culture plates and medium) or that produce large and confounding signals in omics outputs (e.g. NMR or MS spectra). In the case of in vivo studies, discussion of limitations should include any potential source of bias of the animal model or imprecision associated with the result.
        comments:
          - If known, describe study limitations that could affect the outcome of interpretation of results.
        exact_mappings:
          - oecd_oorf_2023:2.1.10

  TERMModelSelection:
