    attributes:
      biological_replicates:
        description: |-
          Biological replicates

          Biological replicates: Describe the number of biological replicates in each treatment condition.
        comments:
          - Clearly describe the number of biological replicates in each treatment condition. Information may be provided as a data object. If so, report the file name of the data object.
