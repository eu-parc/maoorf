  TERMTypesOfTreatments:
    description: |-
      Types of treatments

      The study design report must include a description of the type(s) of treatment.
    exact_mappings:
      - oecd_oorf_2023:2.4.4
    attributes:
      controls:
        description: |-
          Controls

          Controls: Defined as experimental samples derived from animals or cells treated with their respective dose formulation, in the absence of test item. All control types should be reported (i.e. positive control, negative control, vehicle control, blank, etc.) following the criteria described in Section 2 - Test and Control Items.
        comments:
          - Provide descriptions of all control sample types used in the toxicology experiment. This includes positive, negative and/or vehicle controls or blanks.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.4.4.a
      pre_treatments:
        description: |-
          Pre-treatments (eg metabolic activation)

          Pre-treatments: Where necessary, a description of pre-treatments involving metabolic activation, for example of specific cytochromes(s) P450, should be provided.
        comments:
          - If applicable, describe if any relevant pre-treatments of test subjects or cells occurred prior application of test item that may impact results. Examples would be a switch from growth media to test media for in vitro studies or induction of metabolic enzymes in in vivo studies. If no such pre-treatments were used, report "NONE"
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.4.4.b
      acclimation:
        description: |-
          Acclimation

          Acclimation: A brief description of acclimation should be reported to include the length of the acclimation period, health status of the test system, and environmental conditions. Relevant quarantine conditions should be described, where applicable.
        comments:
          - If applicable, describe acclimiation of test subjects to the testing environment prior to application of test item. If no such acclimiation occurred, reported "NONE".
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.4.4.c
      types_of_replicates:
        description: |-
          Types of replicates

          Types of replicates: The report should clearly define the number of biological replicates (samples derived from individual animals or cell samples), utilised for each dose level. This should be clearly delineable from any technical replicates generated, (the sample processed more than once) and/or analytical replicates (the same sample analysed more than once). If relevant, clearly define what constitutes a biological replicate for the in vitro study being reported.
        comments:
          - "Provide a narrative description of the types of replicates used in the experiment. For example: 1) in in vivo studies, biological replicates are individual animals who receive the same treatment. 2) in vitro studies biological replicates may be considered samples that were administered the same treatment but sampled from independent cultures or replicated experiments. Technical repliaces are treatments tested more than once in the same experiment. Analytical repliactes are samples that will be analyzed twice in the same experiment."
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:2.4.4.d

