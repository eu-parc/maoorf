id: https://w3id.org/eu-parc/maoorf/modules/ssrm
name: maoorf_ssrm
title: Study Summary Reporting Module (SSRM)
description: >-
  Study Summary Reporting Module (SSRM) of the OECD Omics Reporting Framework (OORF)
license: MIT

prefixes:
  maoorf: https://w3id.org/eu-parc/maoorf/
  linkml: https://w3id.org/linkml/
  oecd_oorf_2023: https://w3id.org/eu-parc/oecd/oorf/2023/

default_prefix: maoorf
default_range: string

imports:
  - linkml:types
  - ../core/types
  - ../core/entities

classes:
  SSRM:
    description: |-
      Study Summary Reporting Module (SSRM)

      This module describes a subset of mandatory reporting elements in order to provide a high-level summary of the application of omics to a regulatory toxicology study. With the exception of the reporting element in Section 1 - Study identifiers, see below, each section is derived from reporting elements described elsewhere within this Guidance Document. Specifically, this includes summarising the TERM, any Data Acquisition & Processing Reporting Module(s) (DAPRMs) used and any Data Analysis Reporting Module(s) (DARMs) used.
    exact_mappings:
      - oecd_oorf_2023:1
    attributes:
      study_identifiers:
        description: |-
          Study Identifiers

          Unique study identifiers and links to related study records.
        range: SSRMStudyIdentifiers
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.1
      study_rationale:
        description: |-
          Study Rationale

          Summary of the Toxicology Experiment Reporting Module (TERM) key descriptors.
        range: SSRMStudyRationale
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.2
      data_acquisition_and_processing:
        description: |-
          Data Acquisition and Processing

          In this section, specify the Data Acquisition and Processing Reporting Module(s) used to document the omics experiment. Also provide brief narrative descriptions of the omics technology used in the experiment, the rationale for using that technology, the sample preparation method and the use of quality assurance and quality control (QA/QC) methods used during data acquisition or processing.
        range: SSRMDataAcquisitionAndProcessing
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.3
      data_analysis:
        description: |-
          Data Analysis

          In this section, specify the Data Analysis Reporting Module(s) used to document the analysis of omics data that were performed. Also provide a brief narrative description and accompanying rationale for the data analysis approach(es) that were used.
        range: SSRMDataAnalysis
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.4

  SSRMStudyIdentifiers:
    description: |-
      Study Identifiers

      Unique study identifiers and links to related study records for the Study Summary Reporting Module.
    exact_mappings:
      - oecd_oorf_2023:1.1
    attributes:
      abstract:
        description: |-
          Abstract

          Provide a narrative abstract describing the toxicology study. Identify the test item(s) and include details of the experimental models, general design (e.g. dose-response, time series, etc.), omic technology used and omics data analysis that were performed. Also provide a brief description of the results of regulatory interest.
        comments:
          - Provide a narrative abstract describing the toxicology study. Identify the test item(s) and Include details of the experimental models, general design (e.g. dose-response, time series, etc.), omics technology used and data omics analyses that were performed. Please also provide a brief description of the results of regulatory interest.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.1.1
      study_identifier:
        description: |-
          Study identifier

          Provide a unique identifier for the study.
        comments:
          - Provide a unique identifier for this study.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.1.2
      standardised_toxicology_dataset:
        description: |-
          Standardised toxicology dataset

          If applicable, provide a link to a standardised toxicology dataset associated with this study. An example is linkage to an OECD test dataset (e.g. IUCLID ESR).
        comments:
          - If applicable, provide a link to a standardized toxicology dataset associated with this study. An example is linkage to an OECD test dataset (e.g. IUCLID ESR)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.1.3
      complete_omics_dataset:
        description: |-
          Complete omics dataset

          If applicable, provide a link to the complete omics dataset associated with this study. An example is linkage to a MetaboLights, ArrayExpress or NCBI GEO dataset accession number.
        comments:
          - If applicable, provide a link to the complete omics dataset associated with this study. An example is linkage to a MetaboLights, ArrayExpress or NCBI GEO dataset accession number.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.1.4

  SSRMStudyRationale:
    description: |-
      Study Rationale

      Summary of the Toxicology Experiment Reporting Module (TERM) key descriptors.
    exact_mappings:
      - oecd_oorf_2023:1.2
    attributes:
      background_information:
        description: |-
          Background Information

          Provide necessary background information for the end user to understand the rationale for why the study was undertaken, including the regulatory question(s).
        comments:
          - Provide necessary background information for the end user to understand the rationale for why the study was undertaken, including the regulatory question(s).
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.2.1
      objectives:
        description: |-
          Objectives

          Clearly define the objectives of the omics study toward informing the regulatory question. Describe whether the omic study results are intended to be interpreted in isolation or in combination with results from other (non-omics) studies.
        comments:
          - Clearly define the objectives of the omic study toward informing the regulatory question. Describe whether the omic study results are intended to be interpreted in isolation or in combination with results from other (non-omics) studies
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.2.2
      test_item:
        description: |-
          Test item

          Summary of test item identifiers and information.
        range: SSRMTestItem
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.2.3
      test_system_characteristics_in_vivo:
        description: |-
          Test System Characteristics (In Vivo)

          Summary of in vivo test system characteristics.
        comments:
          - Enter all characteristics of the in vivo test system that are known. If unknown, report "UNKNOWN". If not an in vivo study, enter "NOT IN VIVO STUDY"
        range: SSRMTestSystemInVivo
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.2.4
      test_system_characteristics_in_vitro:
        description: |-
          Test System Characteristics (In Vitro)

          Summary of in vitro test system characteristics.
        comments:
          - Enter all characteristics of the in vitro test system that are known. If unknown, report "UNKNOWN". If not an in vitro study, enter "NOT IN VITRO STUDY"
        range: SSRMTestSystemInVitro
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.2.5
      study_design:
        description: |-
          Study Design

          Summary of dose levels, dose intervals, biological replicates, and sample collection timetable.
        range: SSRMStudyDesign
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.2.6
      treatment_conditions:
        description: |-
          Treatment Conditions

          Summary of route of administration and identity of vehicle.
        range: SSRMTreatmentConditions
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.2.7
      sample_collection:
        description: |-
          Sample Collection

          Summary of biological sample type and sample preservation method.
        range: SSRMSampleCollection
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:1.2.8

