        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.1.2
      flow_cell_used:
        description: |-
          Flow cell used (type and catalogue number)

          Flow cell used (type and catalogue number)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.1.3
      targeting_probe_annotation:
        description: |-
          Targeting probe annotation, including list of attenuated genes (if any) (for targeted RNA-Seq only)

          Targeting probe annotation, including the list of attenuated genes (if any) (for targeted RNA-Seq only)
        comments:
          - If targeted RNA-Seq is not used in this experiment, report "NA"
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.1.4
      library_type:
        description: |-
          Library type (eg mRNA libraries)

          Library type (e.g. mRNA libraries)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.1.5
      purpose:
        description: |-
          Purpose (eg target gene expression, quality control, etc)

          Purpose (e.g. target gene expression, quality control, etc.)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.1.6
      other:
        description: |-
          Other

          Other relevant information
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.1.7

  RNASeqExperimentalDesign:
    description: |-
      Transcriptomics Experimental Design

      The experimental design starts with defining the RNA extraction method (if used), the sample pooling strategy, batch processing (if applicable), the possible use of spike-in (or other internal control), the library preparation method and the analytical processes applied to assess sample and library preparation quality.
    exact_mappings:
      - oecd_oorf_2023:3.2.2
    attributes:
      rna_processing:
        description: |-
          RNA Processing

          The methodologies used for RNA sample collection, processing and storage will impact the final research results and should be reported in detail.
        comments:
          - Describe methods used for preparation of RNA samples.
        range: RNASeqRNAProcessing
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.2.1
      library_preparation:
        description: |-
          Library Preparation

          Library preparation methods for RNA-Seq and targeted RNA-Seq must be reported fully, since not all library preparation methods will be comparable.
        comments:
          - Provide descriptions for each of the processing steps below that are applicable to the toxicology experiments and links to proecdures or protocols if posted in a public-facing location.
        range: RNASeqLibraryPreparation
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.2.2
      sample_pooling_protocol:
        description: |-
          Sample Pooling Protocol (if applicable)

          With the exception of low throughput Illumina sequencing platforms (i.e. MiSeq, iSeq or MiniSeq), the sequencing output of the majority of sequencing platforms is too high to cost-effectively sequence a single transcriptome sample at a time. Instead, samples are pooled and sequenced together.
        range: RNASeqSamplePoolingProtocol
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.2.3
      batch_processing_of_samples:
        description: |-
          Batch Processing of Samples (if applicable)

          It is important to assign samples from different treatment groups (and/or different treatment duration, cell types, doses etc.) to different batches and to try to include equal number of samples from each group in order to minimise batch effects and maximise biological differences.
        range: RNASeqBatchProcessing
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.2.4
      wet_lab_quality_control:
        description: |-
          Wet Lab Quality Control

          Several quality control steps should be used to assess the quality and concentration of the generated libraries and ensure the robustness of the produced sequence data.
        range: RNASeqWetLabQualityControl
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.2.5
      sequencing_quality_control_criteria:
        description: |-
          Sequencing Quality Control/Criteria

          Quality control standard and sequencing quality metrics.
        range: RNASeqSequencingQualityControl
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.2.6

