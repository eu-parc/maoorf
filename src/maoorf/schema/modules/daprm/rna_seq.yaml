          - oecd_oorf_2023:3.2.3.2
      raw_data_filtering:
        description: |-
          Raw Data Filtering

          RNA-Seq and targeted RNA-Seq data analysis usually starts by removing the samples with insufficient sequencing depth. Following this exclusion based on read depth, FASTQ reads can be trimmed to either shorten the effective read length, or to remove the reads that would have too low a quality score.
        range: RNASeqRawDataFiltering
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.2.3.3
