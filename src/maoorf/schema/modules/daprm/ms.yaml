      scripts_or_workflow_files:
        description: |-
          Script(s)/workflow file(s) or a reference to a URL or DOI of the script(s)/workflow file(s) (optional)

          Script(s)/workflow file(s) or a reference to a URL or DOI of the script(s)/workflow file(s) (optional)
