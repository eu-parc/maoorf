        exact_mappings:
          - oecd_oorf_2023:3.4.5.1.4
      references_to_protocols_or_publications:
        description: |-
          Reference to relevant protocol(s) or publication(s)

          Reference(s) to relevant protocol(s) or publication(s).
        exact_mappings:
          - oecd_oorf_2023:3.4.5.1.5

  MSDemonstrationOfQuality:
    description: |-
      Demonstration of quality of mass spectrometry metabolomics analysis

      Performance and QC precision/reproducibility reports for mass spectrometry metabolomics.
    exact_mappings:
      - oecd_oorf_2023:3.4.6
    attributes:
      mass_spectrometer_performance_report:
        description: |-
          Performance achieved using system suitability QC, relative to a laboratory's acceptance criteria, to confirm instrumentation is fit for purpose Depending on the assay selected, relevant criteria can include: quantitative reporting of m/z shift; retention time shift; shape and/or intensity of selected peaks

          Performance achieved using system suitability QC, relative to a laboratory's acceptance criteria, to confirm instrumentation is fit for purpose. Depending on the assay selected, relevant criteria can include: quantitative reporting of m/z shift; retention time shift; shape and/or intensity of selected peaks.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.4.6.1.1
      intrastudy_qc_precision_report:
        description: |-
          Measure of a study's analytical precision achieved using intrastudy QC samples, relative to a laboratory's acceptance criteria, to confirm analyses are of sufficient quality for regulatory purposes To include quantitative reporting of the RSDs of feature intensity (mandatory), m/z (optional) and retention time (if relevant; optional), for example reported as the distribution and median of RSD values of all feature intensities across all intrastudy QC samples; and a qualitative assessment of the similarity of intrastudy QCs using PCA, reported as a PCA scores plot from a global analysis of all the biological and intrastudy QC samples

          Measure of a study's analytical precision achieved using intrastudy QC samples, relative to a laboratory's acceptance criteria, to confirm analyses are of sufficient quality for regulatory purposes. To include quantitative reporting of the RSDs of feature intensity (mandatory), m/z (optional) and retention time (if relevant; optional), for example reported as the distribution and median of RSD values of all feature intensities across all intrastudy QC samples; and a qualitative assessment of the similarity of intrastudy QCs using PCA, reported as a PCA scores plot from a global analysis of all the biological and intrastudy QC samples.
        comments:
          - Should be reported as a supplemental file to the main reporting template and referenced here and in the File manifest tab
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.4.6.2.1
      intralaboratory_qc_reproducibility_report:
        description: |-
          Measure of intralaboratory (and interstudy) reproducibility, using intralaboratory QC samples, to assess any long term differences between separate studies within the laboratory

          Measure of intralaboratory (and interstudy) reproducibility, using intralaboratory QC samples, to assess any long term differences between separate studies within the laboratory.
        comments:
          - Should be reported as a supplemental file to the main reporting template and referenced here and in the File manifest tab
        exact_mappings:
          - oecd_oorf_2023:3.4.6.3.1
      interlaboratory_qc_reproducibility_report:
        description: |-
          Interlaboratory QC reproducibility report (optional)

          Interlaboratory QC reproducibility report (optional).
        range: MSInterlaboratoryQCReport
        exact_mappings:
          - oecd_oorf_2023:3.4.6.4

  MSInterlaboratoryQCReport:
    description: |-
      Interlaboratory QC reproducibility report (optional)

      Interlaboratory QC features and reproducibility measure.
    exact_mappings:
      - oecd_oorf_2023:3.4.6.4
    attributes:
      features_detected_in_interlaboratory_qc:
        description: |-
          Features (m/z, intensities) detected in interlaboratory QC (eg defined features in a (standard) reference material) This reporting is likely to evolve as the community improves its use of interlaboratory QC samples

          Features (m/z, intensities) detected in interlaboratory QC (e.g. defined features in a (standard) reference material). This reporting is likely to evolve as the community improves its use of interlaboratory QC samples.
        comments:
          - Should be reported as a supplemental file to the main reporting template and referenced here and in the File manifest tab
        exact_mappings:
          - oecd_oorf_2023:3.4.6.4.1
      measure_of_interlaboratory_reproducibility:
        description: |-
          Measure of interlaboratory reproducibility, using interlaboratory QC samples, to assess any differences between separate laboratories; ie performance standard achieved relative to specified amounts of metabolites

          Measure of interlaboratory reproducibility, using interlaboratory QC samples, to assess any differences between separate laboratories; i.e. performance standard achieved relative to specified amounts of metabolites.
        exact_mappings:
          - oecd_oorf_2023:3.4.6.4.2

  MSOutputsDataMatrices:
    description: |-
      Outputs: Data matrices from metabolomics assays

      Sample list, metabolite annotation/identification, and metabolite quantification data matrices.
    exact_mappings:
      - oecd_oorf_2023:3.4.7
    attributes:
      sample_list:
        description: |-
          For each biological sample: Unique biological sample identifier; Order of extraction of biological samples; Order of mass spectrometric data acquisition; Whether any biological samples were removed from the study and justification for doing so (eg outlier detected using PCA due to limited sample volume)

          For each biological sample:
          a. Unique biological sample identifier (as an example, a concatenation of selected parameters such as: m(001)p(7d)DG0MOAXY where m = male, (001) = animal number, p = matrix (p=plasma), (7d) = day of sampling after study start, DG0 = dose group (0 = control group), MoAXY = study identifier of study XY);
          b. Order of extraction of biological samples;
          c. Order of mass spectrometric data acquisition;
          d. Whether any biological samples were removed from the study and justification for doing so (e.g. outlier detected using PCA due to limited sample volume).
        comments:
          - Should be reported as supplemental file(s) to the main reporting template and referenced here and in the File manifest tab. Note that reporting elements from section 3.4.7.1 (Sample list), 3.4.7.2 (Metabolite annotation/identification) and 3.4.7.3 (metabolite quantification) can be reported together in an Excel file separated by tabs for each relevant section
        recommended: true
        exact_mappings:
