id: https://w3id.org/eu-parc/maoorf/modules/daprm/microarray
name: maoorf_microarray
title: Microarray DAPRM
description: >-
  Data Acquisition and Processing Reporting Module (DAPRM) for Microarray Data
license: MIT

prefixes:
  maoorf: https://w3id.org/eu-parc/maoorf/
  linkml: https://w3id.org/linkml/
  oecd_oorf_2023: https://w3id.org/eu-parc/oecd/oorf/2023/

default_prefix: maoorf
default_range: string

imports:
  - linkml:types
  - ./base_daprm

classes:
  MicroarrayDAPRM:
    is_a: DAPRM
    description: |-
      Data Acquisition and Processing Reporting Module (DAPRM) for Microarray

      This module provides a reporting framework for describing a microarray technology, documenting transcriptomic study experimental design including platform-specific sample processing (such as addition of controls, labelling and hybridisation), details of raw data acquisition and format and how normalisation, data filtering and outlier identification and removal was conducted.
    comments:
      - "INSTRUCTIONS TO DATA PROVIDERS: Use Column D for data entry. Text in italics are instructions (e.g. reporting tips) for the data submitter for individual reporting fields. Text in bold italics are instructions for the data submitter that are applicable to all reporting elements in a section. For additional clarification regarding a reporting field, please refer to the corresponding guidance document for this reporting template."
    exact_mappings:
      - oecd_oorf_2023:3.1
    attributes:
      technology:
        description: |-
          Technology

          This section describes the information a scientist requires for determining analytical sensitivity, limits of detection, interference, and precision (reproducibility and repeatability) of the microarray technology used in a transcriptomic experiment.
        range: MicroarrayTechnology
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.1
      transcriptomics_experimental_design:
        description: |-
          Transcriptomics Experimental Design

          The microarray experimental design includes defining sample pooling (if applicable), batch processing (if applicable), the types and use of microarray controls, sample processing (how samples were labelled and hybridised to microarrays), and analytical processes applied to assess sample and hybridisation data quality.
        range: MicroarrayExperimentalDesign
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2
      specification_of_raw_data:
        description: |-
          Specification of Raw Data

          Images from a scanned microarray slide contain features (spots) of various signal intensities, comprising the raw data for a microarray experiment. A detailed description of how and in what form the raw data is generated is crucial for downstream analysis such as identification of differentially expressed genes.
        range: MicroarraySpecificationOfRawData
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.3
      data_filtering_pre_normalisation:
        description: |-
          Data Filtering (Pre-normalisation)

          Filtering can be applied pre or post normalisation. This module specifies the information a regulatory scientist needs to understand the types of filtering that were applied to gene expression data.
        comments:
          - Filtering of microarray data to remove lowly expressed or unreliably detected genes in a common practice and also impacts downstream analyses. There are a variety of approaches for microarray data filtering. Please identify the approach used for data filter and complete the associated reporting fields. Please enter "NA" in reporting firles associated with filtering methods that were not used.
        range: MicroarrayDataFilteringPreNormalisation
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.4
      data_normalisation:
        description: |-
          Data Normalisation

          Normalisation is the process by which data are adjusted to take account of technical variation in the study. Reporting elements are provided below for a variety of approaches; the relevant methodology should be selected to report on the pertinent parameters applied in the analysis.
        comments:
          - There are many approaches for microarray data normalization. Please identify the approach used for data normalization and complete the associated reporting fields. Please enter "NA" in reporting firles associated with normalization methods that were not used in the experiment.
        range: MicroarrayDataNormalisation
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.5
      data_filtering_post_normalisation:
        description: |-
          Data Filtering (Post-normalisation)

          This module specifies reporting requirements for the most used post-normalisation filtering, as well as an option to report on other approaches.
        comments:
          - Filtering of microarray data to remove lowly expressed or unreliably detected genes in a common practice and also impacts downstream analyses. There are a variety of approaches for microarray data filtering. Please identify the approach used for data filter and complete the associated reporting fields. Please enter "NA" in reporting firles associated with filtering methods that were not used.
        range: MicroarrayDataFilteringPostNormalisation
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.6
      identification_and_removal_of_low_quality_or_outlying_data_sets:
        description: |-
          Identification and Removal of Low Quality or Outlying Data Sets

          The primary purpose of removing an outlier sample is to decrease the leverage of the sample on any downstream analyses and the within group variance so that the statistical differences between comparison groups and identification of effects due to test article treatment can be maximised.
        range: MicroarrayOutlierRemovalSection
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.7

  MicroarrayTechnology:
    description: |-
      Technology

      Microarray technology specifications.
    exact_mappings:
      - oecd_oorf_2023:3.1.1
    attributes:
      type_and_version_of_platform:
        description: |-
          Type and version of the platform, manufacturer's name and associated genome build

          Type and version of the platform, manufacturer's name (e.g. Affymetrix U133 Plus 2.0 Array) and associated genome build (e.g., GenBank version – GRCh38)
        comments:
          - Descrobe the type an version of the microarray platform. An example of a platform is "Affymetrix U133 Plus 2.0 Array". An example of a genome build is "GenBank version - GRCh38)"
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.1.1
      unique_identifier:
        description: |-
          The unique identifier

          The unique identifier (e.g. serial number) and manufacturer
        comments:
          - Include the serial numbers of all microarrays used in the study and their mapping to samples. Information may be provided as a data object. If so, please report the data object file name here.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.1.2
      feature_type:
        description: |-
          Feature type

          Feature type (e.g. spotted oligonucleotide)
        comments:
          - Describe the feature type used in the microarray technology to measure gene expression (e.g. spotted oligonucleotide, etc.)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.1.3
      feature_annotation:
        description: |-
          Feature annotation

          Feature annotation (e.g. probe IDs)
        comments:
          - Provide either a publically-accessible link or a data object containing the microarray feature annotation. Please provide the link or the file name of the data object in this reporting field.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.1.4
      purpose_of_features:
        description: |-
          Purpose of feature(s)

          Purpose of feature(s) (e.g. target gene expression, quality control, etc.)
        comments:
          - Please indicate the purpose of each type of feature included on the microarry technology. Purposes may include measurement of target gene expression, quality control or other purposes. A generalized narrative description of each feature type may be reported or information may be contained in a data object. If the latter, please report the link or name of the data object in this reporting field.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.1.5
      composition_of_features:
        description: |-
          Composition of feature(s)

          Composition of feature(s) (i.e. oligo sequence, ligated product sequence)
        comments:
          - Please indicate the composition of each type of feature included on the microarray technology. Examples of compositions include 'oligo sequence' or 'ligated product sequence', etc. A generalized narrative description of each feature type may be reported or information may be contained in a data object. If the latter, please report the link or name the data object in this reporting field.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.1.6
      control_console_operating_system:
        description: |-
          Control console operating system

          Control console operating system
        comments:
          - Please report the control console operating system that was used to collect the microarray data.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.1.7
      other_relevant_information:
        description: |-
          Other relevant information

          Other relevant information
        comments:
          - Please report any other relevant information regarding the microarray technology that would be needed to assess study quality or for others to reproduce the experiment.
        exact_mappings:
          - oecd_oorf_2023:3.1.1.8

  MicroarrayExperimentalDesign:
    description: |-
      Transcriptomics Experimental Design

      Microarray transcriptomics experimental design.
    exact_mappings:
      - oecd_oorf_2023:3.1.2
    attributes:
      rna_processing:
        description: |-
          RNA Processing

          The methodologies used for RNA sample collection, processing, quality assessment, and storage will have effects on the final research results and should be reported in detail.
        comments:
          - Describe methods used for preparation of RNA samples.
        range: MicroarrayRNAProcessing
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1
      sample_pooling_protocol:
        description: |-
          Sample Pooling Protocol (if applicable)

          The design of the transcriptomics study also includes determining if RNA samples need to be pooled/processed together due to insufficient quantity required for performing the microarray experiment.
        range: MicroarraySamplePoolingProtocol
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.2
      batch_processing_of_samples:
        description: |-
          Batch Processing of Samples (if applicable)

          When there are many samples within a study, the microarray experiment may have to be conducted in 2 or more batches.
        range: MicroarrayBatchProcessing
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.3
      linear_amplification_labelling_cdna_crna_preparation:
        description: |-
          Linear Amplification, Labelling, cDNA/cRNA Preparation

          Prior to hybridisation to microarrays, RNA samples are converted to cDNA and processed through a variety of platform-specific labelling protocols.
        range: MicroarrayLabellingPreparation
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.4
      hybridization:
        description: |-
          Hybridization

          Hybridisation is the process of complementary binding between a labelled target cRNA and an oligonucleotide probe on a microarray.
        range: MicroarrayHybridization
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.5
      scanning_of_microarray:
        description: |-
          Scanning of Microarray

          The microarray slides are scanned using a scanner to obtain images of hybridised arrays.
        range: MicroarrayScanning
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.6
      array_quality_control_metrics_criteria:
        description: |-
          Array Quality Control Metrics/Criteria

          Quality control is among the most important of quality assurance measures. Controls are used to check assay performance, with special focus on the least robust components.
        comments:
          - If quality control procedures were used during microarray data acquisition, describe them below. If controls were not used to assess assay performance, please report "NA" in each reporting field.
        range: MicroarrayQualityControlMetrics
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.7

  MicroarrayRNAProcessing:
    description: |-
      RNA Processing

      RNA extraction, purification, storage, and quantification/qualification for Microarray.
    comments:
      - Describe methods used for preparation of RNA samples.
    exact_mappings:
      - oecd_oorf_2023:3.1.2.1
    attributes:
      type_of_extracted_rna:
        description: |-
          Type of extracted RNA (eg, total RNA, mRNA, miRNA)

          Type of extracted RNA (e.g. total RNA, mRNA, miRNA)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1.a
      extraction_and_purification_techniques:
        description: |-
          Extraction and purification techniques

          Extraction and purification techniques
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1.b
      procedures_for_mrna_enrichment:
        description: |-
          Procedures for mRNA enrichment (if applicable), or other enrichment procedures

          Procedures for mRNA enrichment (if applicable), or other enrichment procedures
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1.c
      storage_conditions:
        description: |-
          Storage conditions

          Storage conditions
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1.d
      quantification_and_qualification_of_rna:
        description: |-
          Quantification and Qualification of RNA

          Quantification and qualification of RNA.
        range: MicroarrayRNAQuantification
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1.e

  MicroarrayRNAQuantification:
    description: |-
      Quantification and Qualification of RNA

      Quantification and qualification of RNA for Microarray.
    exact_mappings:
      - oecd_oorf_2023:3.1.2.1.e
    attributes:
      tool_for_rna_assessment:
        description: |-
          Tool for RNA assessment

          Tool for RNA Assessment
        comments:
          - Describe the instrument used for RNA assessment (e.g., Nanodrop, QuBit, Bioanalyzer, etc.)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1.e.i
      rna_quality:
        description: |-
          RNA quality

          RNA quality (e.g. A260/A280 ratio, RIN for eukaryotic RNA, PERM number for eukaryotic RNA extracted from formalin-fixed paraffin embedded tissues).
        comments:
          - Describe the RNA quality metric used in the study and the threshold for acceptance / exclusion of samples. Example include A260/A280 ratios, RIN, PERM, etc.). If this type of metric was not used to exlude samples prior to omics data collection, report "NA"
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1.e.ii
      rna_yield:
        description: |-
          RNA yield

          RNA yield (e.g. RNA/gr of tissue, RNA/10^6 cells)
        comments:
          - Describe the RNA quantity metric used in the study and threshold for accpetance / exclusion of samples. Examples include RNA/gr of tissue or RNA/number of cells, etc. If this type of metric was not used as a sample exclusion criteria, report "NA"
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1.e.iii
      performance_metrics:
        description: |-
          Performance metrics

          Performance metrics
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.1.e.iv

  MicroarraySamplePoolingProtocol:
    description: |-
      Sample Pooling Protocol (if applicable)

      Sample pooling protocol for Microarray.
    exact_mappings:
      - oecd_oorf_2023:3.1.2.2
    attributes:
      sample_pooling_occurred:
        description: |-
          Whether any sample pooling has occurred (samples being combined into one hybridisation)

          Whether any sample pooling has occurred (samples being combined into one hybridisation) – yes/no
        comments:
          - Report "YES" or "NO".
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.2.a
      reason_for_pooling:
        description: |-
          Reason for pooling of samples

          Reason for pooling of samples
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.2.b
      how_samples_were_pooled:
        description: |-
          How samples were pooled

          How samples were pooled – quantity and which samples were pooled?
        comments:
          - If sample pooling was performed, please describe which samples were pooled with each other and in what ratio.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.2.c
      other_relevant_information:
        description: |-
          Other relevant information

          Other relevant information
        comments:
          - Please report any other relevent information regarding sample pooling that would be needed to assess study quality or for others to repeat the experiment. Report "NONE" if no other information will be provided.
        exact_mappings:
          - oecd_oorf_2023:3.1.2.2.d

  MicroarrayBatchProcessing:
    description: |-
      Batch Processing of Samples (if applicable)

      Batch processing of samples for Microarray.
    exact_mappings:
      - oecd_oorf_2023:3.1.2.3
    attributes:
      number_of_batches:
        description: |-
          Number of batches

          Number of batches
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.3.a
      number_of_samples_in_each_batch:
        description: |-
          Number of samples used in each batch of the microarray experiment

          Number of samples used in each batch of the microarray experiment
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.3.b
      how_samples_assigned_to_batches:
        description: |-
          How the samples were assigned to each batch (ie the criteria)

          How the samples were assigned to each batch (i.e. the criteria)
        comments:
          - If sample batching occurred, describe the criteria used to guide the separation of samples into different batches. If not batching occurred, report "NA".
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.3.c
      method_of_sample_assignment:
        description: |-
          Method of sample assignment to different batches

          Method of sample assignment to different batches (for example, simple randomisation, randomised block design etc.)
        comments:
          - If applicable, describe the method for sample assignment to different batches (e.g. simple randomization, randomized block design, etc.)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.3.d

  MicroarrayLabellingPreparation:
    description: |-
      Linear Amplification, Labelling, cDNA/cRNA Preparation

      Linear amplification, labelling, and cDNA/cRNA preparation.
    exact_mappings:
      - oecd_oorf_2023:3.1.2.4
    attributes:
      labeling_protocol:
        description: |-
          Labeling protocol

          Specify whether the labelling protocol is manufacturer specific, modified or custom – describe the protocol in detail)
        comments:
          - Describe the labeling protocol in detail. If the labeling protocol is available on a public-facing repository or other accessible location, please provide a link. The protocol may also be provided as a data object. If so, please input the file name of the data object here.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.4.a
      labeling_description:
        description: |-
          Labeling description

          Specify whether the label has been added during the reverse transcription step or following amplification, whether the label is fluorescent (and the wavelength of the fluoroprobe) or radioactive, whether the labelling is direct or there is a pre-label and with a detection process after hybridisation. Specify if the hybridisation is two colour (two samples) or single (one sample).
        comments:
          - Describe the properties of the label in detail including at what step the label is added (during reverse transcription or following amplification), the detection chemistry (e.g. fluorescent, radiolabel, etc.), whether the labeling was direct or indirect and when the labeling occures in relationship to hybridization (before or after).
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.4.b
      other_relevant_information:
        description: |-
          Other relevant information

          Other relevant information
        comments:
          - Please report any other information reqarding linear amplification and sampling labeling that would be needed to assess study quality or for others to repeat the experiment. Report "NONE" if no other information will be provided.
        exact_mappings:
          - oecd_oorf_2023:3.1.2.4.c

  MicroarrayHybridization:
    description: |-
      Hybridization

      Microarray hybridization protocol and information.
    exact_mappings:
      - oecd_oorf_2023:3.1.2.5
    attributes:
      hybridization_protocol:
        description: |-
          Hybridization protocol

          Provide the name of the protocol and state whether the protocol is manufacturer specific, modified or custom. Describe the protocol in detail.
        comments:
          - Describe the hybridization protocol in detail. If the hybridization protocol is available on a public-facing repository or other accessible location, please provide a link. The protocol may also be provided as a data object. If so, please input the file name of the data object here.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.5.a
      hybridization_information:
        description: |-
          Hybridization information

          In addition to the specific protocol used in the experiment, a full description of the design must be provided including the dates of hybridisation for slides/microarrays, association of physical unit identifiers with sample IDs, hybridisation oven temperature and hybridisation time (e.g. 12 hours).
        comments:
          - Describe the details of the microarray hybridization including the dates of hybridzation for slides/microarrays, association of physical unit identifiers with sample IDs, hybridization oven temparature and hybridization time. This information may be provided as a data object. If so, please input the file name of the data object here.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.5.b

  MicroarrayScanning:
