          Name of instrument manufacturer
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.6.b
      type_of_instrument:
        description: |-
          Type of instrument (scanner type)

          Type of instrument (Scanner type)
        comments:
          - Report the specific make and model number of the microarray scanner.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.6.c
      scan_rate:
        description: |-
          Scan rate

          Scan rate
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.6.d
      scanning_time:
        description: |-
          Scanning time

          Scanning time
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.6.e
      lasers_used_and_power:
        description: |-
          Lasers used (wavelength or type) and power

          Lasers used (wavelength or type) and power
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.6.f
      other_pertinent_settings:
        description: |-
          Other pertinent settings

          Other pertinent settings
        exact_mappings:
          - oecd_oorf_2023:3.1.2.6.g
      description_of_output_type:
        description: |-
          Description of output type (eg tiff image)

          Description of output type (e.g. .tiff image)
        comments:
          - Provide a description of the output type from microarray scanning (e.g. TIFF image)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.6.h
      other_relevant_information:
        description: |-
          Other relevant information

          Other relevant information
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.6.i

  MicroarrayQualityControlMetrics:
    description: |-
      Array Quality Control Metrics/Criteria

      Quality control metrics and criteria for Microarray.
    comments:
      - If quality control procedures were used during microarray data acquisition, describe them below. If controls were not used to assess assay performance, please report "NA" in each reporting field.
    exact_mappings:
      - oecd_oorf_2023:3.1.2.7
    attributes:
      quality_control_approach_sample_types:
        description: |-
          Quality control approach/sample type(s)

          Examples are housekeeping genes, spiked controls, exogenous controls, no template controls, etc. State the type and source of each.
        comments:
          - Please provide a text description of the types of controls used in the microarray experiment to evaluate assay performance.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.7.a
      quality_control_applicability:
        description: |-
          Quality control applicability

          Describe what aspects of sample processing they are designed to evaluate (e.g. efficiency of amplification or labelling, hybridisation, etc.). Describe what level of the experimental design they are intended to address (e.g. individual sample quality, sample batch quality).
        comments:
          - Indicate the aspects of sample processing and/or level in the transcriptomics experimental design each type of control sample is intended to address.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.7.b
      quality_control_performance_metrics:
        description: |-
          Quality control performance metric(s)

          Quality control performance metric(s)
        comments:
          - Describe the quality control performance metric(s) used for each quality control approach / sample type.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.7.c
      quality_control_accept_reject_criteria:
        description: |-
          Quality control accept/reject criteria

          Quality control accept/reject criteria
        comments:
          - Describe the accept / reject criteria used for each quality controls approach / sample type.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.7.d
      technical_and_experimental_replicates:
        description: |-
          Technical and experimental replicates

          Describe the intended use of technical and experimental replicates for quality control. Describe summary/aggregation strategies across replicates.
        comments:
          - Provide a description of technical and experimental replicates included in the study, their intended use and summary / aggregation strategy across replicates
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.7.e
      evaluation_metrics_for_spike_in_controls:
        description: |-
          Evaluation metrics for spike-in controls

          Evaluation metrics for spike-in controls
        comments:
          - If applicable, describe evaluation metrics for spike-in controls. If not applicable, report "NA".
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.1.2.7.f
      reproducibility_of_replicate_probes:
        description: |-
          Reproducibility of replicate probes

          Reproducibility for replicated probes (e.g. the median CV of replicate probes)
        comments:
          - If applicable, provide summary statistics for the reproducibility of replicated probes on each microarrays. Examples of summary statistics include median coefficient of variation (CV) of replicated probes. Information may be provided as a data object. If so, please input the file name of the data object or provide a link. If not applicable, input "NA".
        recommended: true
