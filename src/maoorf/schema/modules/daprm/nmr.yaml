  NMROutputsDataMatrices:
    description: |-
      Outputs: Data matrices from metabolomics assays

      Sample list, metabolite annotation/identification, and metabolite quantification data matrices for NMR.
    exact_mappings:
      - oecd_oorf_2023:3.5.7
    attributes:
      sample_list:
        description: |-
          For each biological sample: Unique biological sample identifier; Order of extraction of biological samples; Order of NMR data acquisition; Whether any biological samples were removed from the study and justification for doing so (eg outlier detected using PCA due to limited sample volume)

          For each biological sample:
          a. Unique biological sample identifier (as an example, a concatenation of selected parameters such as: m(001)p(7d)DG0MOAXY where m = male, (001) = animal number, p = matrix (p=plasma), (7d) = day of sampling after study start, DG0 = dose group (0 = control group), MoAXY = study identifier of study XY);
          b. Order of extraction of biological samples;
          c. Order of NMR data acquisition;
          d. Whether any biological samples were removed from the study and justification for doing so (e.g. outlier detected using PCA due to limited sample volume).
        comments:
          - Should be reported as supplemental file(s) to the main reporting template and referenced here and in the File manifest tab. Note that reporting elements from section 3.5.7.1 (Sample list), 3.5.7.2 (Metabolite annotation/identification) and 3.5.7.3 (metabolite quantification) can be reported together in an Excel file separated by tabs for each relevant section
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.7.1.1
      metabolite_annotation_identification:
        description: |-
          For each resonance and/or metabolite: Chemical shift value(s) (ppm), Multiplicity/splitting pattern, Molecular formula, Common metabolite name, Structural code, Metabolite identifier(s), Common metabolite class name, MSI level of identification (levels 1-4), and known unknown status

          For each resonance and/or metabolite:
          a. Chemical shift value(s) (ppm) for all relevant nuclei;
          b. Multiplicity/splitting pattern (e.g. doublet) for each relevant 1H peak;
          c. Molecular formula (if known);
          d. Common metabolite name (if known);
          e. Structural code (e.g. standard InChI string or SMILES) (if known);
          f. Metabolite identifier(s) from relevant database(s) (e.g. PubChem, HMDB);
          g. Common metabolite class name (if relevant).
          h. MSI level of identification (levels 1-4)
          i. For level 4 only, indicate whether the resonance is a 'known unknown' or not.
        comments:
