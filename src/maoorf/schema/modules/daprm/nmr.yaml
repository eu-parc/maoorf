    attributes:
      overall_description_and_rationale:
        description: |-
          Overall description and rationale for NMR spectroscopy metabolomics approach, for example including sample type, extraction method, technology type, processing methods and QA/QC

          Overall description and rationale for NMR spectroscopy metabolomics approach, for example including sample type, extraction method, technology type, processing methods and QA/QC.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.1.1
      technology_types_used:
        description: |-
          Technology type(s) used (eg "1D 1H-NMR", "2D 13C–1H HSQC NMR", "2D HSQC–TOCSY NMR", "2D 1H–1H TOCSY" or any other NMR approach used)

          Technology type(s) used (e.g. "1D 1H NMR", "2D 1H JRES", "2D 1H–1H TOCSY", "2D 1H–13C HSQC NMR", or any other NMR approach used).
        comments:
          - If the technology type used is not listed in the examples please provide the full name of the technique used as well as the abberviated form
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.1.2
      links_to_sops_or_publications:
        description: |-
          Link(s) to relevant SOP(s) or publication(s) of approach used (optional)

          Link(s) to relevant SOP(s) or publication(s) of approach used (optional).
        exact_mappings:
          - oecd_oorf_2023:3.5.1.3

  NMRSampleProcessingAndExtraction:
    description: |-
      Sample processing and metabolite extraction and addition of chemical reference standards

      Metabolite extraction, concentration/reconstitution, and chemical reference standards for NMR.
    exact_mappings:
      - oecd_oorf_2023:3.5.2
    attributes:
      extraction_method_general_description:
        description: |-
          Extraction method general description, including per-sample amounts, solvent(s) used and their ratios, means of agitation/maceration, temperatures and times, and post extraction handling

          Extraction method general description, including per-sample amounts, solvent(s) used and their ratios, means of agitation/maceration, temperatures and times, and post extraction handling.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.2.1.1
      extract_concentration_and_reconstitution:
        description: |-
          Drying and reconstitution method general description, including final reconstitution, solvent(s) and final volume (if used), storage temperature (if relevant) and duration of reconstituted extracts (if relevant)

          Drying and reconstitution method general description, including final reconstitution solvent(s) and final volume (if used), pH buffer type and concentration (if used), storage temperature (if relevant) and duration of reconstituted extracts (if relevant).
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.2.2.1
      chemical_reference_standard_preparation:
        description: |-
          For each new standard (or each named panel of standards) prepared for this study: Purpose of standard, Quantification type, Calibration methodology, Identity, Purity, Supplier, Preparation method, and Concentration(s)

          For each new standard (or each named panel of standards) prepared for this study:
          a. Purpose of standard (e.g. extraction standard; annotation/identification only; annotation/identification and quantification; chemical shift reference standard)
          b. Quantification type (if relevant; e.g. absolute quantification or relative quantification)
          c. Calibration methodology (if relevant; e.g. external calibration (without matrix), external matrix-matched calibration, calibration by internal normalisation, standard addition calibration, internal calibration)
          d. Identity (including common name and, for example, PubChem CID, HMDB id, KEGG id, CAS, InChI, InChIKey, SMILES)
          e. Purity (if known)
          f. Supplier
          g. Preparation method (including whether standard spiked internally into the biological sample or alternative external solution)
          h. Concentration(s)
        comments:
          - Details should be included for any chemical reference standards that were prepared for this study. If many chemical reference standards are to be recorded here, it is recommended that a supplemental file with these details should be reported, and referenced here and in the file manifest
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.2.3.1

  NMRAnalyticalQualityAssuranceAndQC:
