id: https://w3id.org/eu-parc/maoorf/modules/daprm/nmr
name: maoorf_nmr
title: NMR Metabolomics DAPRM
description: >-
  Data Acquisition and Processing Reporting Module (DAPRM) for NMR Metabolomics
license: MIT

prefixes:
  maoorf: https://w3id.org/eu-parc/maoorf/
  linkml: https://w3id.org/linkml/
  oecd_oorf_2023: https://w3id.org/eu-parc/oecd/oorf/2023/

default_prefix: maoorf
default_range: string

imports:
  - linkml:types
  - ./base_daprm

classes:
  NMRDAPRM:
    is_a: DAPRM
    description: |-
      Data Acquisition and Processing Reporting Module (DAPRM) for NMR Metabolomics

      In this Data Acquisition and Processing Reporting Module we describe the reporting required for an NMR-based metabolomics study, including sample processing, metabolite extraction and addition of standards; analytical QA/QC; acquisition and processing of NMR data; demonstrating the quality of the data; and the data matrices produced by this technology, including metabolite annotation/identification and intensities.
    comments:
      - "INSTRUCTIONS TO DATA PROVIDERS: Use Column E for data entry. Text in bold italics are instructions for the data submitter that are applicable to all reporting elements in a section. For additional clarification regarding a reporting field, please refer to the corresponding guidance document for this reporting template"
    exact_mappings:
      - oecd_oorf_2023:3.5
    attributes:
      overall_description_and_rationale:
        description: |-
          Overall description and rationale for NMR metabolomics approach

          Overall description and rationale for NMR spectroscopy metabolomics approach, technology types used, and links to relevant SOPs or publications.
        range: NMROverallDescriptionAndRationale
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.1
      sample_processing_and_metabolite_extraction:
        description: |-
          Sample processing and metabolite extraction and addition of chemical reference standards

          While the specific protocols for metabolite extraction will depend on the sample type (i.e. biofluid, cells, tissue, etc.) being measured, a reporting framework that can capture the most important information about a diverse range of methods is presented here.
        range: NMRSampleProcessingAndExtraction
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.2
      analytical_quality_assurance_and_qc_samples:
        description: |-
          Analytical quality assurance and preparation of quality control samples

          When conducting an untargeted metabolomics study using NMR, it is essential to have a quality assurance (QA) framework and use quality control (QC) samples, as described in the MERIT best practice guidelines.
        range: NMRAnalyticalQualityAssuranceAndQC
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.3
      acquisition_of_nmr_data:
        description: |-
          Acquisition of NMR metabolomics and metabolite data

          NMR spectroscopy assay types, instrument configurations and methods, and sample acquisition order.
        range: NMRAcquisitionOfData
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.4
      processing_of_nmr_data:
        description: |-
          Processing of NMR metabolomics and metabolite data

          This section covers the reporting of established processes for converting raw NMR data acquired on an instrument to processed NMR data that is in a form amenable for statistical analysis.
        range: NMRProcessingOfData
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.5
      demonstration_of_quality_of_nmr_analysis:
        description: |-
          Demonstration of quality of NMR spectroscopy metabolomics analysis

          This section covers the reporting of data that will allow the quality of the NMR metabolomics dataset to be assessed by the regulator. Measures of quality are derived from the appropriate uses of different types of QC samples.
        range: NMRDemonstrationOfQuality
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.6
      outputs_data_matrices:
        description: |-
          Outputs: Data matrices from metabolomics assays

          The outputs include a data matrix that conveniently summarises the biological samples that were analysed, and whether any of these samples were removed from the study, with a justification, as well as metabolite annotation/identification and metabolite quantification.
        range: NMROutputsDataMatrices
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.7

  NMROverallDescriptionAndRationale:
    description: |-
      Overall description and rationale for NMR metabolomics approach

      Overall description and rationale for NMR spectroscopy metabolomics approach.
