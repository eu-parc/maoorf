  NMRDemonstrationOfQuality:
    description: |-
      Demonstration of quality of NMR spectroscopy metabolomics analysis

      Performance and QC precision/reproducibility reports for NMR metabolomics.
    exact_mappings:
      - oecd_oorf_2023:3.5.6
    attributes:
      nmr_spectrometer_performance_report:
        description: |-
          Performance achieved using system suitability QC, relative to a laboratory's acceptance criteria, to confirm instrumentation is fit-for-purpose To include quantitative reporting of chemical shift reference peak full width at half maximum height (FWHM) without window function applied, 90 degree pulse width, and probe temperature variation Reporting an image(s) of aligned and stacked spectra for visual inspection is recommended to facilitate an assessment of the general quality of all spectra

          Performance achieved using system suitability QC, relative to a laboratory's acceptance criteria, to confirm instrumentation is fit-for-purpose. To include quantitative reporting of chemical shift reference peak full width at half maximum height (FWHM) without window function applied, 90 degree pulse width, and probe temperature variation (plus or minus value in oC). Reporting an image(s) of aligned and stacked spectra for visual inspection is recommended to facilitate an assessment of the general quality of all spectra.
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.6.1.1
      intrastudy_qc_precision_report:
        description: |-
          Measure of a study's analytical precision achieved using intrastudy QC samples, relative to a laboratory's acceptance criteria, to confirm analyses are of sufficient quality for regulatory purposes To include quantitative reporting of the RSDs of feature intensity (mandatory), m/z (optional) and retention time (if relevant; optional), for example reported as the distribution and median of RSD values of all feature intensities across all intrastudy QC samples; and a qualitative assessment of the similarity of intrastudy QCs using PCA, reported as a PCA scores plot from a global analysis of all the biological and intrastudy QC samples

          Measure of a study's analytical precision achieved using intrastudy QC samples, relative to a laboratory's acceptance criteria, to confirm analyses are of sufficient quality for regulatory purposes. To include quantitative reporting of the RSDs of feature intensity (mandatory), for example reported as the distribution and median of RSD values of all feature intensities across all intrastudy QC samples; and a qualitative assessment of the similarity of intrastudy QCs using PCA, reported as a PCA scores plot from a global analysis of all the biological and intrastudy QC samples.
        comments:
          - Should be reported as a supplemental file to the main reporting template and referenced here and in the File manifest tab
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.5.6.2.1
      intralaboratory_qc_reproducibility_report:
        description: |-
          Measure of intralaboratory (and interstudy) reproducibility, using intralaboratory QC samples, to assess any long-term differences between separate studies within the laboratory

          Measure of intralaboratory (and interstudy) reproducibility, using intralaboratory QC samples, to assess any long-term differences between separate studies within the laboratory.
        comments:
          - Should be reported as a supplemental file to the main reporting template and referenced here and in the File manifest tab
        exact_mappings:
          - oecd_oorf_2023:3.5.6.3.1
      interlaboratory_qc_reproducibility_report:
        description: |-
          Interlaboratory QC reproducibility report (optional)

          Interlaboratory QC reproducibility report (optional).
