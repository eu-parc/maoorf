id: https://w3id.org/eu-parc/maoorf/modules/daprm/qrt_pcr
name: maoorf_qrt_pcr
title: qRT-PCR DAPRM
description: >-
  Data Acquisition and Processing Reporting Module (DAPRM) for Quantitative Reverse Transcription Polymerase Chain Reaction (qRT-PCR)
license: MIT

prefixes:
  maoorf: https://w3id.org/eu-parc/maoorf/
  linkml: https://w3id.org/linkml/
  oecd_oorf_2023: https://w3id.org/eu-parc/oecd/oorf/2023/

default_prefix: maoorf
default_range: string

imports:
  - linkml:types
  - ./base_daprm

classes:
  QRTPCRDAPRM:
    is_a: DAPRM
    description: |-
      Data Acquisition and Processing Reporting Module (DAPRM) for Quantitative Reverse Transcription Polymerase Chain Reaction (qRT-PCR)

      This module provides a reporting framework for describing a qPCR-based toxicogenomic experiment, including sample preparation, assay design, and data collection and processing. This module is largely based on the existing minimum information for publication of quantitative real-time PCR experiments (MIQE) guidelines but has been adapted for the OORF.
    comments:
      - "INSTRUCTIONS TO DATA PROVIDERS: Use Column D for data entry. Text in italics are instructions (e.g. reporting tips) for the data submitter for individual reporting fields. Text in bold italics are instructions for the data submitter that are applicable to all reporting elements in a section. For additional clarification regarding a reporting field, please refer to the corresponding guidance document for this reporting template."
    exact_mappings:
      - oecd_oorf_2023:3.3
    attributes:
      sample_processing:
        description: |-
          Sample Processing

          This section describes all of the sample processing that is required after tissues are collected from an exposure experiment up to before the qRT-PCR amplification reaction. This includes the RNA extraction protocol, assessment of RNA quantity and quality, and the reverse transcription of RNA into cDNA.
        range: QRTPCRSampleProcessing
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.3.1
      assay_design:
        description: |-
          qRT-PCR Assay Design

          This section describes which qRT-PCR assay-specific details should be reported. These include a description of the assay format (single- or multi-gene), technology (double-stranded DNA dye, probe-based, etc.) and protocol employed, information about the target genes and the oligonucleotides used to detect them, and any assay validation data.
        range: QRTPCRAssayDesign
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.3.2
      data_analysis:
        description: |-
          Data Analysis

          This section describes the details that should be reported for the analysis of qRT-PCR data. This includes information about how the Cq values are determined, quality control results, pre-processing of low/high-signal samples, and the data normalisation method employed.
        range: QRTPCRDataAnalysis
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:3.3.3

