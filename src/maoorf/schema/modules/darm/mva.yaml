  MVAVariableImportance:
    description: |-
      Multivariate statistical analysis - variable importance for feature selection

      Variable importance and feature selection methods, significance threshold, and literature citations.
    comments:
      - Reporting elements are only relevant if variable importance and feature selection performed - otherwise report elements as NA
    exact_mappings:
      - oecd_oorf_2023:4.2.8
    attributes:
      name_and_description_of_method:
        description: |-
          Name and description of method used for variable importance/selection

          Name and description of method used for variable importance/selection
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:4.2.8.1
      details_of_how_significance_threshold_determined:
        description: |-
          Details of how significance threshold determined

          Details of how significance threshold determined
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:4.2.8.2
      citations_to_literature:
        description: |-
          Methods should include clear citations to literature describing them

          Citation(s) to relevant literature describing methods (if available)
        recommended: true
        exact_mappings:
          - oecd_oorf_2023:4.2.8.3

  MVAOutputs:
    is_a: DARMOutputs
    description: |-
      Outputs

      Outputs and supporting files for multivariate statistical analysis.
    exact_mappings:
      - oecd_oorf_2023:4.2.9
    slot_usage:
      output_and_supporting_files:
        description: |-
          Complete the file manifest included as part of the reporting template

          Complete the file manifest included as part of the reporting template. The manifest must include the listing of all files included in the regulatory application package specific to the analysis. Each file in the manifest must be accompanied by a description of the file. If the file being described is a tabular file, then the rows and columns must be described so that anyone can understand the contents of the file. Supporting files may include analysis scripts, software configurations or tables of metadata. The phrase `data object` refers to any machine readable input, output or metadata file.
          Method specific requirements:
          1. If unsupervised methods used, output of the unsupervised methods including plots (e.g. PCA scores, loadings, proportion of variance explained)
          2. If supervised methods used, output of the supervised method including plots (e.g. PLS scores, loadings/weights, regression coefficients, proportion of variance in outcome explained by the model)
          3. If validation performed, validation statistics (Q2, error rate, etc.)
          4. If feature selection was performed, list of features selected by the method including a. Feature importance (e.g. VIP value) b. Feature significance (e.g. p-value, if available)
        exact_mappings:
          - oecd_oorf_2023:4.2.9.1
