id: https://w3id.org/eu-parc/maoorf/core/base
name: maoorf_base
title: OORF Base Classes
description: Abstract base classes for Data Acquisition and Processing Reporting Modules
  (DAPRM) and Data Analysis Reporting Modules (DARM)
license: MIT
prefixes:
  maoorf: https://w3id.org/eu-parc/maoorf/
  linkml: https://w3id.org/linkml/
  oecd_oorf_2023: https://w3id.org/eu-parc/oecd/oorf/2023/
default_prefix: maoorf
default_range: string
imports:
- linkml:types
- ./types
classes:
  DAPRM:
    abstract: true
    description: 'Data Acquisition and Processing Reporting Modules (DAPRMs)


      Data Acquisition and Processing Reporting Modules (DAPRMs) capture and report
      descriptions of the omics assays, data acquisition and associated data processing
      prior to statistical analysis. These modules are unique to each omics data type.
      Furthermore, the reporting described is generalisable and adaptable, because
      (1) it is not the intention of this Guidance Document to prescribe the types
      of assays that the regulatory toxicology community should use; (2) technologies
      will continue to evolve and we want the OORF to remain relevant; and (3) omics
      assays often do not fit well into predefined boxes.'
    exact_mappings:
    - oecd_oorf_2023:3
    attributes:
      type:
        description: Module type discriminator for the Data Acquisition and Processing
          Reporting Module
        designates_type: true
  DARM:
    abstract: true
    description: 'Data Analysis Reporting Modules (DARMs)


      These modules serve to capture and report descriptions of the statistical analysis
      that is undertaken in the omics study, for example for the purposes of discovering
      differentially abundant molecules (eg differentially expressed genes in a transcriptomic
      study). The modules were designed to accommodate various types of omics data
      and can thus be applied to multi-omic data sets. There is one or more DARM per
      study (a minimum of one is mandatory) dependent upon the type(s) of data analysis
      applied to the datasets.'
    exact_mappings:
    - oecd_oorf_2023:4
    slots:
    - inputs
    - outputs
    attributes:
      type:
        description: Module type discriminator for the Data Analysis Reporting Module
        designates_type: true
  DARMInputs:
    description: 'Inputs for a Data Analysis Reporting Module (DARM)


      Input for data analysis, in the form of processed omics data (eg normalised
      gene expression data, normalised metabolome data) is generated using processes
      described in a DAPRM. Metadata files containing information associating omics
      samples with experimental parameters are often also necessary for conducting
      an analysis.'
    slots:
    - data_input
    - metadata_input
  DARMOutputs:
    description: 'Outputs and Supporting Files for a Data Analysis Reporting Module
      (DARM)


      Complete the file manifest included as part of the reporting template. The manifest
      must include the listing of all files included in the regulatory application
      package specific to the analysis. Each file in the manifest must be accompanied
      by a description of the file.'
    slots:
    - output_and_supporting_files
slots:
  inputs:
    description: 'Inputs


      Input for data analysis, in the form of processed omics data (eg normalised
      gene expression data, normalised metabolome data) is generated using processes
      described in a DAPRM. The user should indicate what file(s) / data are used
      as the input for the analysis. Metadata files containing information associating
      omics samples with experimental parameters (eg treatments, dose levels, time
      points, sex, etc) may also be necessary for the analysis. The user should specify
      these files as well.'
    range: DARMInputs
    recommended: true
  outputs:
    description: 'Outputs and Supporting Files


      Complete the file manifest included as part of the reporting template. The manifest
      must include the listing of all files included in the regulatory application
      package specific to the analysis. Each file in the manifest must be accompanied
      by a description of the file. If the file being described is a tabular file,
      then the rows and columns must be described so that anyone can understand the
      contents of the file. Supporting files may include analysis scripts, software
      configurations or tables of metadata. The phrase `data object` refers to any
      machine readable input, output or metadata file.'
    range: DARMOutputs
    recommended: true
  data_input:
    description: 'Data Input(s)


      Provide the name of the input data object(s)'
    comments:
    - Provide the data object(s) that will be used as input for the analysis. List
      data object name(s) in the file manifest tab.
    recommended: true
  metadata_input:
    description: 'Metadata Input(s)


      Provide the name of the input metadata object(s)'
    comments:
    - Provide the metadata object(s) that will be used as input for the analysis.
      List data object name(s) in the file manifest tab.
    recommended: true
  output_and_supporting_files:
    description: 'Output and Supporting Files


      Complete the file manifest included as part of the reporting template. The manifest
      must include the listing of all files included in the regulatory application
      package specific to the analysis. Each file in the manifest must be accompanied
      by a description of the file. If the file being described is a tabular file,
      then the rows and columns must be described so that anyone can understand the
      contents of the file. Supporting files may include analysis scripts, software
      configurations or tables of metadata. The phrase `data object` refers to any
      machine readable input, output or metadata file.'
    comments:
    - The operator should use the File Manifest tab to describe any outputs or supplementary
      files associated with the analysis described in this reporting module.
    recommended: true
  type:
    description: Module type discriminator for the Data Acquisition and Processing
      Reporting Module
