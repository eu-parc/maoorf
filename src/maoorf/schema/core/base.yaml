      reference standards
  analytical_quality_assurance_and_qc_samples:
    description: Analytical quality assurance and preparation of quality control samples
  outputs_data_matrices:
    description: 'Outputs: Data matrices from metabolomics assays'
  technology_types_used:
    description: Technology type(s) used, eg LC-MS, LC-MS/MS, GC-MS, GC-MS/MS, DI-MS,
      DIMS/MS, or other
  links_to_sops_or_publications:
    description: Link(s) to relevant SOP(s) or publication(s) of approach used (optional)
  extraction_method_general_description:
    description: Extraction method general description, including per-sample amounts,
      solvent(s) used and their ratios, means of agitation/maceration, temperatures
      and times, and post extraction handling
  extract_concentration_and_reconstitution:
    description: Drying and reconstitution method general description, including final
      reconstitution, solvent(s) and final volume (if used), storage temperature (if
      relevant) and duration of reconstituted extracts (if relevant)
  chemical_reference_standard_preparation:
    description: 'For each new standard (or each named panel of standards) prepared
      for this study: Purpose of standard, Quantification type, Calibration methodology,
      Identity, Purity, Supplier, Preparation method, and Concentration(s)'
  qc_samples:
    description: Sample details for system suitability QC sample (if used), intrastudy
      QC sample, intralaboratory QC sample (if used) and interlaboratory QC sample
      (if used) Should include details of source, preparation details, batch number
      (if relevant), certificate of analysis (COA) (if relevant), storage conditions
      and days since preparation
  process_blank_sample:
    description: Type of process blank, start and end points of the 'process' used
      to prepare this sample, and storage conditions
  instrument_configurations_and_methods:
    description: File(s) summarising instrument configuration and method details of
      analysis performed See Section 34 - Table 3 of OORF Guidance Document for suggested
      reporting elements depending on the instrumentation and method applied
  acquisition_order:
    description: Acquisition order for QC samples, biological samples and reference
      standard samples
  assay_types_used:
    description: Mass spectrometry assay type(s) used (see Section 34 - Table 2 of
      OORF Guidance Document)
  how_sample_acquisition_order_defined:
    description: Describe how sample acquisition order was defined, eg frequency of
      intrastudy QCs, method to randomise biological sample order
  acquisition_order_table:
    description: Acquisition order of all types of QC samples, biological samples
      and reference standard samples (if relevant), thereby indicating the number
      of pre-conditioning QC samples, the number of process blank samples, and the
      frequency of analysis of intrastudy QC samples
  data_processing_workflows:
    description: Data processing workflow(s)
  data_reduction:
    description: Data reduction method(s) and parameters used - including (where relevant)
      details of feature detection/picking, retention time alignment, feature grouping/matching,
      and feature integration
  identification_and_removal_of_outlying_samples:
    description: Methods and parameters used to identify and remove samples (if used;
      see section 71 for actual samples removed)
  normalisation:
    description: Normalisation method(s) and parameters (if used)
  normality_testing_scaling_and_transformations:
    description: Normality testing, scaling and/or transformation methods and parameters
      (if used)
  processing_methods_for_metabolite_quantification:
    description: Description of method(s) and parameters for metabolite quantification
      - including (where relevant) for relative- and/or semi- and/or absolute quantification
  processing_methods_for_metabolite_annotation_and_identification:
    description: Description of method(s) and parameters for metabolite annotation/identification
      - including (if relevant) whether reference standards are from in-house or external
      spectral library(ies) and the spectral library(ies) used
  workflow_description:
    description: Data processing workflow description
  software_names_and_versions:
    description: Name(s) and version(s) of the software used
  scripts_or_workflow_files:
    description: Script(s)/workflow file(s) or a reference to a URL or DOI of the
      script(s)/workflow file(s) (optional)
  data_processing_histories_or_logs:
    description: Data processing history(ies) or log(s) (optional)
  references_to_protocols_or_publications:
    description: Reference to relevant protocol(s) or publication(s)
  intrastudy_qc_precision_report:
    description: Measure of a study's analytical precision achieved using intrastudy
      QC samples, relative to a laboratory's acceptance criteria, to confirm analyses
      are of sufficient quality for regulatory purposes To include quantitative reporting
      of the RSDs of feature intensity (mandatory), m/z (optional) and retention time
      (if relevant; optional), for example reported as the distribution and median
      of RSD values of all feature intensities across all intrastudy QC samples; and
      a qualitative assessment of the similarity of intrastudy QCs using PCA, reported
      as a PCA scores plot from a global analysis of all the biological and intrastudy
      QC samples
  intralaboratory_qc_reproducibility_report:
    description: Measure of intralaboratory (and interstudy) reproducibility, using
      intralaboratory QC samples, to assess any long term differences between separate
      studies within the laboratory
  interlaboratory_qc_reproducibility_report:
    description: Interlaboratory QC reproducibility report (optional)
  measure_of_interlaboratory_reproducibility:
    description: Measure of interlaboratory reproducibility, using interlaboratory
      QC samples, to assess any differences between separate laboratories; ie performance
      standard achieved relative to specified amounts of metabolites
  sample_list:
    description: 'For each biological sample: Unique biological sample identifier;
      Order of extraction of biological samples; Order of mass spectrometric data
      acquisition; Whether any biological samples were removed from the study and
      justification for doing so (eg outlier detected using PCA due to limited sample
      volume)'
  metabolite_annotation_identification:
    description: 'For each feature and/or metabolite: Analytical identifiers, Ion
      form, Molecular formula(e), Monoisotopic molecular mass, Common metabolite name,
      Structural code, Metabolite identifier(s), Common metabolite class name, MSI
      level of identification (levels 1-4), known unknown status, m/z error, Retention
      time error, and fragmentation score'
  metabolite_quantification:
    description: Metabolite quantification
  data_matrices_of_intensities:
    description: Data matrices of all feature/metabolite intensities, across all remaining
      (ie not removed as outliers) biological and intrastudy QCs samples
  software_documentation:
    description: Software Documentation
  contrasts:
